        // ==========================================
        // 4. OFFSCREEN BACKGROUND CACHE & LAYOUT
        // ==========================================
        function rebuildBackgroundCache() {
            bgCacheCanvas.width = canvas.width;
            bgCacheCanvas.height = canvas.height;

            const stage = OCEAN_STAGES[(oceanLevel - 1) % OCEAN_STAGES.length];
            const bgGrad = bgCacheCtx.createLinearGradient(0, 0, 0, canvas.height);
            bgGrad.addColorStop(0, stage.topColor);
            bgGrad.addColorStop(0.55, stage.midColor);
            bgGrad.addColorStop(1, stage.botColor);
            bgCacheCtx.fillStyle = bgGrad;
            bgCacheCtx.fillRect(0, 0, canvas.width, canvas.height);

            bgCacheCtx.strokeStyle = 'rgba(56, 189, 248, 0.03)';
            bgCacheCtx.lineWidth = 1;
            const step = 90;
            for (let x = 0; x < canvas.width; x += step) {
                bgCacheCtx.beginPath();
                bgCacheCtx.moveTo(x, 0);
                bgCacheCtx.lineTo(x, canvas.height);
                bgCacheCtx.stroke();
            }
            for (let y = 0; y < canvas.height; y += step) {
                bgCacheCtx.beginPath();
                bgCacheCtx.moveTo(0, y);
                bgCacheCtx.lineTo(canvas.width, y);
                bgCacheCtx.stroke();
            }
        }

        function updateLayout() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            rebuildBackgroundCache();

            cannon.x = canvas.width / 2;
            cannon.y = canvas.height - 44;

            cannon.minusBtn.x = cannon.x - 76;
            cannon.minusBtn.y = cannon.y + 8;
            cannon.plusBtn.x = cannon.x + 76;
            cannon.plusBtn.y = cannon.y + 8;

            const isCompact = canvas.width < 760;
            const sideOffset = isCompact ? 112 : 128;

            // LEFT OF TURRET: LED Coin Tray ("KHAY XU")
            cannon.coinBox.w = isCompact ? 165 : 215;
            cannon.coinBox.h = isCompact ? 56 : 64;
            cannon.coinBox.x = Math.max(10, cannon.x - sideOffset - cannon.coinBox.w);
            cannon.coinBox.y = canvas.height - cannon.coinBox.h - 8;

            cannon.coinBox.coinTargetX = cannon.coinBox.x + 28;
            cannon.coinBox.coinTargetY = cannon.coinBox.y + cannon.coinBox.h / 2;

            // Free +1,000 Coins button directly above the Coin Tray
            cannon.rechargeBtn.w = cannon.coinBox.w;
            cannon.rechargeBtn.h = 28;
            cannon.rechargeBtn.x = cannon.coinBox.x;
            cannon.rechargeBtn.y = cannon.coinBox.y - 33;

            // RIGHT OF TURRET: Auto-Fire, Lock-Boss & Summon Boss Dock
            const rightDockX = Math.min(
                canvas.width - (isCompact ? 175 : 222) - 10,
                cannon.x + sideOffset
            );
            const rightDockW = isCompact ? 170 : 216;
            const halfW = (rightDockW - 6) / 2;

            cannon.autoBtn.w = halfW;
            cannon.autoBtn.h = 30;
            cannon.autoBtn.x = rightDockX;
            cannon.autoBtn.y = canvas.height - 72;

            cannon.lockBtn.w = halfW;
            cannon.lockBtn.h = 30;
            cannon.lockBtn.x = rightDockX + halfW + 6;
            cannon.lockBtn.y = canvas.height - 72;

            cannon.summonBtn.w = rightDockW;
            cannon.summonBtn.h = 30;
            cannon.summonBtn.x = rightDockX;
            cannon.summonBtn.y = canvas.height - 38;
        }

        window.addEventListener('resize', updateLayout);
        updateLayout();
        mouse.x = canvas.width / 2;
        mouse.y = canvas.height / 3;

        for (let i = 0; i < 6; i++) {
            lightRays.push({
                x: Math.random() * window.innerWidth,
                width: 85 + Math.random() * 110,
                angle: 0.16 + Math.random() * 0.1,
                speed: 0.0007 + Math.random() * 0.0006,
                phase: Math.random() * Math.PI * 2
            });
        }

        for (let i = 0; i < 20; i++) {
            bubbles.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                r: 2 + Math.random() * 5,
                speed: 0.5 + Math.random() * 1.1,
                wobble: Math.random() * Math.PI * 2
            });
        }

        // ==========================================
        // 5. LEVEL UP PROGRESSION SYSTEM
        // ==========================================
        function updateProgressionHUD() {
            const stage = OCEAN_STAGES[(oceanLevel - 1) % OCEAN_STAGES.length];
            stageLevelBadgeEl.textContent = `CẤP ${oceanLevel}`;
            stageNameTextEl.textContent = stage.name;
            const bonusPct = Math.round((rewardMultiplier - 1) * 100);
            stageBonusTextEl.textContent = `+${bonusPct}% THƯỞNG XU`;
            const pct = Math.min(100, Math.round((currentExp / expToNextLevel) * 100));
            expBarFillEl.style.width = `${pct}%`;
            expTextEl.textContent = `${Math.floor(currentExp)}/${expToNextLevel} EXP`;
        }

        function addOceanExp(amount) {
            currentExp += amount;
            while (currentExp >= expToNextLevel) {
                currentExp -= expToNextLevel;
                oceanLevel++;
                expToNextLevel = Math.round(300 * Math.pow(1.28, oceanLevel - 1));
                rewardMultiplier = 1 + (oceanLevel - 1) * 0.10;
                triggerOceanLevelUp();
            }
            updateProgressionHUD();
        }

        function triggerOceanLevelUp() {
            sound.playLevelUp();
            rebuildBackgroundCache();
            screenShake = 16;

            const stage = OCEAN_STAGES[(oceanLevel - 1) % OCEAN_STAGES.length];
            const levelBonusCoins = 1500;

            shockwaves.push({
                x: cannon.x,
                y: cannon.y,
                radius: 25,
                maxRadius: Math.max(canvas.width, canvas.height) * 0.65,
                color: '#ffd700',
                alpha: 0.95,
                lineWidth: 8
            });

            // Shower 15 coins (+1,500 Xu) into the left coin tray
            for (let i = 0; i < 15; i++) {
                spawnFlyingCoin(
                    canvas.width / 2 + (Math.random() - 0.5) * 260,
                    canvas.height / 2 + (Math.random() - 0.5) * 120,
                    100,
                    i * 2
                );
            }

            bossWarningBanner = {
                alpha: 1.35,
                text: `🌟 THĂNG CẤP ĐẠI DƯƠNG: CẤP ${oceanLevel} - ${stage.name} 🌟`,
                subtext: `THƯỞNG LÊN CẤP +${levelBonusCoins.toLocaleString('vi-VN')} XU • TĂNG THƯỞNG CÁ +${Math.round((rewardMultiplier - 1) * 100)}%`,
                color: '#4ade80'
            };

            if (countActiveBosses() < 4) {
                spawnBoss();
            }
        }

        updateProgressionHUD();

        // ==========================================
        // 6. AIMING, LOCK-ON BOSS & SINGLE HEAVY CANNON SHOT
        // ==========================================
        function clampTurretAngle(rawAngle) {
            if (rawAngle > -0.10 && rawAngle < Math.PI / 2) return -0.10;
            if (rawAngle >= Math.PI / 2 || rawAngle < -Math.PI + 0.10) return -Math.PI + 0.10;
            return rawAngle;
        }

        function updateAimAngle(clientX, clientY) {
            mouse.x = clientX;
            mouse.y = clientY;
            if (!lockBoss) {
                cannon.angle = clampTurretAngle(Math.atan2(mouse.y - cannon.y, mouse.x - cannon.x));
            }
        }

        function getLockedTarget() {
            let best = null;
            let bestPriority = -1;
            for (let i = 0; i < fishes.length; i++) {
                const f = fishes[i];
                if (f.x < 20 || f.x > canvas.width - 20 || f.y < 20 || f.y > canvas.height - 80) continue;
                const priority = (f.tier === 'boss' ? 10000 : 0) + f.reward;
                if (priority > bestPriority) {
                    bestPriority = priority;
                    best = f;
                }
            }
            return best;
        }

        function changeTurretLevel(deltaOrExact, isExact = false) {
            sound.init();
            const oldLevel = cannon.level;
            if (isExact) {
                cannon.level = Math.max(1, Math.min(5, deltaOrExact));
            } else {
                cannon.level += deltaOrExact;
                if (cannon.level > 5) cannon.level = 1;
                if (cannon.level < 1) cannon.level = 5;
            }
            if (cannon.level !== oldLevel) {
                sound.playSwitchLevel();
                cannon.recoil = 10;
            }
        }

        function triggerFreeRecharge() {
            sound.init();
            for (let i = 0; i < 10; i++) {
                spawnFlyingCoin(
                    cannon.coinBox.x + cannon.coinBox.w / 2 + (Math.random() - 0.5) * 90,
                    cannon.coinBox.y - 65 - Math.random() * 45,
                    100,
                    i * 2
                );
            }
            addFloatingText(cannon.coinBox.x + cannon.coinBox.w / 2, cannon.coinBox.y - 45, '+1.000 XU TIẾP TẾ!', '#4ade80', 1.1);
        }

        function addParticle(x, y, vx, vy, radius, color, decay) {
            if (particles.length >= 90) particles.shift();
            particles.push({ x, y, vx, vy, radius, color, alpha: 1, decay });
        }

        function addFloatingText(x, y, text, color, scale = 1.0) {
            if (floatingTexts.length >= 24) floatingTexts.shift();
            floatingTexts.push({ x, y, text, color, alpha: 1, scale });
        }

        function tryShoot(now) {
            const spec = TURRET_SPECS[cannon.level];
            if (now - lastShotTime < spec.fireDelay) return;

            if (score < spec.cost) {
                coinBoxPulse = 1.3;
                return;
            }

            sound.init();
            saveWalletToStorage(score - spec.cost, true);
            lastShotTime = now;

            cannon.recoil = spec.recoilForce;
            cannon.muzzleFlash = 1.0;
            if (cannon.level === 5) {
                screenShake = Math.max(screenShake, 4.5);
            }
            sound.playShoot(cannon.level);

            const barrelTipDist = spec.barrelLen + 8;
            const spawnX = cannon.x + Math.cos(cannon.angle) * barrelTipDist;
            const spawnY = cannon.y + Math.sin(cannon.angle) * barrelTipDist;

            bullets.push({
                x: spawnX,
                y: spawnY,
                vx: Math.cos(cannon.angle) * spec.speed,
                vy: Math.sin(cannon.angle) * spec.speed,
                radius: spec.bulletRadius,
                power: spec.damage,
                netRadius: spec.netRadius,
                level: cannon.level,
                color: spec.color,
                coreColor: spec.coreColor,
                secondary: spec.secondary,
                bounces: 0,
                maxBounces: 10,
                spin: 0,
                trail: []
            });

            if (cannon.level >= 4) {
                shockwaves.push({
                    x: spawnX,
                    y: spawnY,
                    radius: 8,
                    maxRadius: cannon.level === 5 ? 62 : 40,
                    color: spec.color,
                    alpha: 0.85,
                    lineWidth: cannon.level === 5 ? 4.5 : 3
                });
            }

            const sparkCount = cannon.level === 5 ? 9 : 5;
            for (let i = 0; i < sparkCount; i++) {
                const spread = cannon.angle + (Math.random() - 0.5) * 0.85;
                const spd = 3 + Math.random() * 5.5;
                addParticle(
                    spawnX,
                    spawnY,
                    Math.cos(spread) * spd,
                    Math.sin(spread) * spd,
                    cannon.level === 5 ? (2.5 + Math.random() * 3) : (2 + Math.random() * 2),
                    i % 2 === 0 ? '#ffffff' : spec.color,
                    0.075
                );
            }
        }

        // ==========================================
        // 7. SPAWNING LARGE FISH & TANKY BOSSES
        // ==========================================
        function countActiveBosses() {
            let count = 0;
            for (let i = 0; i < fishes.length; i++) {
                if (fishes[i].tier === 'boss') count++;
            }
            return count;
        }

        function spawnRegularOrLargeFish(spreadAcrossScreen = false) {
            if (fishes.length >= 28) return;

            const totalWeight = FISH_CATALOG.reduce((acc, f) => acc + f.weight, 0);
            let rand = Math.random() * totalWeight;
            let chosen = FISH_CATALOG[0];
            for (let i = 0; i < FISH_CATALOG.length; i++) {
                const item = FISH_CATALOG[i];
                if (rand < item.weight) {
                    chosen = item;
                    break;
                }
                rand -= item.weight;
            }

            const fromLeft = Math.random() < 0.5;
            const margin = chosen.size * 2.2;
            const yPos = 78 + Math.random() * (canvas.height - 240);

            fishes.push({
                type: chosen.id,
                name: chosen.name,
                tier: chosen.tier,
                x: spreadAcrossScreen ? (80 + Math.random() * (canvas.width - 160)) : (fromLeft ? -margin : canvas.width + margin),
                y: yPos,
                baseY: yPos,
                dir: fromLeft ? 1 : -1,
                size: chosen.size,
                speed: chosen.speed * (0.9 + Math.random() * 0.22),
                hp: chosen.hp,
                maxHp: chosen.hp,
                reward: Math.round(chosen.reward * rewardMultiplier),
                exp: chosen.exp,
                primary: chosen.primary,
                secondary: chosen.secondary,
                accent: chosen.accent,
                waveAmp: chosen.tier === 'large' ? (10 + Math.random() * 14) : (14 + Math.random() * 18),
                waveFreq: 0.0018 + Math.random() * 0.0014,
                waveOffset: Math.random() * Math.PI * 2,
                hitFlash: 0
            });
        }

        function spawnBoss(forceSpecificIndex = null) {
            if (countActiveBosses() >= 4) {
                addFloatingText(canvas.width / 2, 120, 'ĐÃ CÓ TỐI ĐA 4 ĐẠI BOSS TRÊN MÀN HÌNH!', '#fbbf24', 1.0);
                return;
            }

            const chosen = forceSpecificIndex !== null
                ? BOSS_CATALOG[forceSpecificIndex % BOSS_CATALOG.length]
                : BOSS_CATALOG[Math.floor(Math.random() * BOSS_CATALOG.length)];

            const fromLeft = Math.random() < 0.5;
            const margin = chosen.size * 2.1;
            const yPos = 130 + Math.random() * Math.max(120, canvas.height - 340);
            const scaledReward = Math.round(chosen.reward * rewardMultiplier);

            fishes.push({
                type: chosen.id,
                name: chosen.name,
                tier: 'boss',
                x: fromLeft ? -margin : canvas.width + margin,
                y: yPos,
                baseY: yPos,
                dir: fromLeft ? 1 : -1,
                size: chosen.size,
                speed: chosen.speed,
                hp: chosen.hp,
                maxHp: chosen.hp,
                reward: scaledReward,
                exp: chosen.exp,
                primary: chosen.primary,
                secondary: chosen.secondary,
                accent: chosen.accent,
                waveAmp: 16 + Math.random() * 14,
                waveFreq: 0.0014,
                waveOffset: Math.random() * Math.PI * 2,
                hitFlash: 0
            });

            sound.playBossSpawn();
            bossWarningBanner = {
                alpha: 1.0,
                text: `⚠️ CẢNH BÁO ĐẠI BOSS: ${chosen.name} ⚠️`,
                subtext: `MÁU: ${chosen.hp.toLocaleString('vi-VN')} HP • THƯỞNG NỔ HŨ: +${scaledReward.toLocaleString('vi-VN')} XU`,
                color: chosen.primary
            };
        }

        for (let i = 0; i < 20; i++) {
            spawnRegularOrLargeFish(true);
        }
        setTimeout(() => {
            spawnBoss(0);
            if (fishes.length > 0) fishes[fishes.length - 1].x = canvas.width * 0.25;
            spawnBoss(3);
            if (fishes.length > 0) fishes[fishes.length - 1].x = canvas.width * 0.72;
        }, 150);

        setInterval(() => spawnRegularOrLargeFish(false), 580);
        setInterval(() => {
            if (countActiveBosses() < 3) {
                spawnBoss();
            }
        }, 11000);

        // ==========================================
        // 8. INPUT HANDLING (MOUSE, TOUCH, KEYBOARD)
        // ==========================================
        function pointInRect(px, py, rect) {
            return px >= rect.x && px <= rect.x + rect.w && py >= rect.y && py <= rect.y + rect.h;
        }

        function handlePointerDown(clientX, clientY) {
            sound.init();

            if (Math.hypot(clientX - cannon.minusBtn.x, clientY - cannon.minusBtn.y) <= cannon.minusBtn.r + 6) {
                changeTurretLevel(-1);
                return;
            }
            if (Math.hypot(clientX - cannon.plusBtn.x, clientY - cannon.plusBtn.y) <= cannon.plusBtn.r + 6) {
                changeTurretLevel(1);
                return;
            }
            if (pointInRect(clientX, clientY, cannon.rechargeBtn)) {
                triggerFreeRecharge();
                return;
            }
            if (pointInRect(clientX, clientY, cannon.autoBtn)) {
                autoFire = !autoFire;
                sound.playSwitchLevel();
                return;
            }
            if (pointInRect(clientX, clientY, cannon.lockBtn)) {
                lockBoss = !lockBoss;
                sound.playSwitchLevel();
                return;
            }
            if (pointInRect(clientX, clientY, cannon.summonBtn)) {
                spawnBoss();
                return;
            }

            updateAimAngle(clientX, clientY);
            isMouseDown = true;
            tryShoot(performance.now());
        }

        canvas.addEventListener('mousemove', (e) => {
            updateAimAngle(e.clientX, e.clientY);
            cannon.minusBtn.hover = Math.hypot(e.clientX - cannon.minusBtn.x, e.clientY - cannon.minusBtn.y) <= cannon.minusBtn.r + 4;
            cannon.plusBtn.hover = Math.hypot(e.clientX - cannon.plusBtn.x, e.clientY - cannon.plusBtn.y) <= cannon.plusBtn.r + 4;
            cannon.rechargeBtn.hover = pointInRect(e.clientX, e.clientY, cannon.rechargeBtn);
            cannon.autoBtn.hover = pointInRect(e.clientX, e.clientY, cannon.autoBtn);
            cannon.lockBtn.hover = pointInRect(e.clientX, e.clientY, cannon.lockBtn);
            cannon.summonBtn.hover = pointInRect(e.clientX, e.clientY, cannon.summonBtn);
        });

        canvas.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            handlePointerDown(e.clientX, e.clientY);
        });

        window.addEventListener('mouseup', () => {
            isMouseDown = false;
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (e.touches.length > 0) {
                const t = e.touches[0];
                handlePointerDown(t.clientX, t.clientY);
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length > 0) {
                const t = e.touches[0];
                updateAimAngle(t.clientX, t.clientY);
            }
        }, { passive: false });

        canvas.addEventListener('touchend', () => {
            isMouseDown = false;
        });

        window.addEventListener('keydown', (e) => {
            if (['1', '2', '3', '4', '5'].includes(e.key)) {
                changeTurretLevel(parseInt(e.key), true);
            } else if (e.key === '-' || e.key === '_') {
                changeTurretLevel(-1);
            } else if (e.key === '=' || e.key === '+') {
                changeTurretLevel(1);
            } else if (e.key.toLowerCase() === 'b') {
                spawnBoss();
            }
        });

        document.getElementById('spawnBossTopBtn').addEventListener('click', () => {
            sound.init();
            spawnBoss();
        });

        document.getElementById('soundBtn').addEventListener('click', () => {
            sound.init();
            sound.enabled = !sound.enabled;
            document.getElementById('soundText').textContent = sound.enabled ? 'BẬT' : 'TẮT';
        });

        // ==========================================
        // 9. REWARDS, FLYING COINS & BOSS JACKPOT
        // ==========================================
        function spawnFlyingCoin(startX, startY, value, delayFrames = 0) {
            if (flyingCoins.length >= 45) {
                saveWalletToStorage(score + value, true);
                return;
            }
            pendingScore += value;
            const cpX = (startX + cannon.coinBox.coinTargetX) / 2 + (Math.random() - 0.5) * 160;
            const cpY = Math.min(startY, cannon.coinBox.coinTargetY) - 90 - Math.random() * 80;

            flyingCoins.push({
                startX,
                startY,
                cpX,
                cpY,
                x: startX,
                y: startY,
                t: 0,
                speed: 0.024 + Math.random() * 0.01,
                delay: delayFrames,
                value,
                spinPhase: Math.random() * Math.PI * 2
            });
        }

        function onFishDefeated(fish) {
            const isBoss = fish.tier === 'boss';
            const coinCount = isBoss ? 22 : (fish.tier === 'large' ? 8 : 4);
            const baseVal = Math.floor(fish.reward / coinCount);
            let remainder = fish.reward - baseVal * coinCount;

            for (let c = 0; c < coinCount; c++) {
                const coinValue = baseVal + (c === 0 ? remainder : 0);
                spawnFlyingCoin(
                    fish.x + (Math.random() - 0.5) * fish.size,
                    fish.y + (Math.random() - 0.5) * fish.size,
                    coinValue,
                    c * 2
                );
            }

            addOceanExp(fish.exp || 15);

            if (isBoss) {
                sound.playBossJackpot();
                screenShake = 18;
                shockwaves.push({
                    x: fish.x,
                    y: fish.y,
                    radius: 20,
                    maxRadius: 240,
                    color: '#ffd700',
                    alpha: 1.0,
                    lineWidth: 6
                });
                jackpotBadges.push({
                    x: Math.max(180, Math.min(canvas.width - 180, fish.x)),
                    y: Math.max(150, Math.min(canvas.height - 200, fish.y)),
                    bossName: fish.name,
                    reward: fish.reward,
                    scale: 0.2,
                    rotation: 0,
                    life: 135
                });
            } else {
                addFloatingText(
                    fish.x,
                    fish.y - 12,
                    `+${fish.reward} XU`,
                    fish.tier === 'large' ? '#fde047' : '#38bdf8',
                    fish.tier === 'large' ? 1.2 : 0.95
                );
            }

            const pCount = isBoss ? 28 : (fish.tier === 'large' ? 14 : 7);
            for (let p = 0; p < pCount; p++) {
                const ang = Math.random() * Math.PI * 2;
                const spd = 2 + Math.random() * (isBoss ? 7.5 : 4.5);
                addParticle(
                    fish.x,
                    fish.y,
                    Math.cos(ang) * spd,
                    Math.sin(ang) * spd,
                    isBoss ? (3 + Math.random() * 3.5) : (2.2 + Math.random() * 2),
                    p % 2 === 0 ? '#ffd700' : fish.primary,
                    isBoss ? 0.022 : 0.038
                );
            }
        }

        // ==========================================
        // 10. 60-FPS SHADOWBLUR-FREE DRAWING FUNCTIONS
        // ==========================================
        function drawOceanBackground(time) {
            ctx.drawImage(bgCacheCanvas, 0, 0);

            for (let i = 0; i < lightRays.length; i++) {
                const ray = lightRays[i];
                const sway = Math.sin(time * ray.speed + ray.phase) * 45;
                const topX = ray.x + sway;
                const botX = topX + Math.tan(ray.angle) * canvas.height;

                ctx.fillStyle = 'rgba(56, 189, 248, 0.045)';
                ctx.beginPath();
                ctx.moveTo(topX - ray.width / 2, 0);
                ctx.lineTo(topX + ray.width / 2, 0);
                ctx.lineTo(botX + ray.width * 1.25, canvas.height * 0.85);
                ctx.lineTo(botX - ray.width * 1.25, canvas.height * 0.85);
                ctx.closePath();
                ctx.fill();
            }

            ctx.fillStyle = 'rgba(186, 230, 253, 0.15)';
            ctx.strokeStyle = 'rgba(224, 242, 254, 0.26)';
            ctx.lineWidth = 1;
            for (let i = 0; i < bubbles.length; i++) {
                const b = bubbles[i];
                b.y -= b.speed;
                b.x += Math.sin(time * 0.003 + b.wobble) * 0.32;
                if (b.y < -15) {
                    b.y = canvas.height + 15;
                    b.x = Math.random() * canvas.width;
                }
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }
        }

        function drawCreature(f, time) {
            ctx.save();
            ctx.translate(f.x, f.y);

            const vy = Math.cos(time * f.waveFreq + f.waveOffset) * f.waveAmp * f.waveFreq * 14;
            const tilt = Math.atan2(vy, f.speed) * 0.32;
            if (f.dir === -1) ctx.scale(-1, 1);
            ctx.rotate(tilt);

            const s = f.size;
            const isFlashing = f.hitFlash > 0;
            const tailSwing = Math.sin(time * 0.014 * f.speed + f.waveOffset) * (s * 0.22);

            if (f.tier === 'boss') {
                ctx.fillStyle = f.primary;
                ctx.globalAlpha = 0.12;
                ctx.beginPath();
                ctx.arc(0, 0, s * 1.15, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }

            if (f.type === 'boss_kraken') {
                ctx.strokeStyle = isFlashing ? '#ffffff' : f.primary;
                ctx.lineCap = 'round';
                ctx.lineWidth = s * 0.13;
                for (let t = 0; t < 8; t++) {
                    const spreadY = ((t - 3.5) / 3.5) * s * 0.65;
                    const wave1 = Math.sin(time * 0.008 + t * 0.9) * (s * 0.25);
                    const wave2 = Math.cos(time * 0.008 + t * 0.9) * (s * 0.32);
                    ctx.beginPath();
                    ctx.moveTo(-s * 0.2, spreadY * 0.5);
                    ctx.bezierCurveTo(
                        -s * 0.7, spreadY + wave1,
                        -s * 1.15, spreadY + wave2,
                        -s * 1.55, spreadY * 1.2 + wave1
                    );
                    ctx.stroke();
                }

                const kGrad = ctx.createRadialGradient(s * 0.2, -s * 0.1, s * 0.1, 0, 0, s);
                kGrad.addColorStop(0, isFlashing ? '#fff' : f.accent);
                kGrad.addColorStop(0.5, isFlashing ? '#f8fafc' : f.primary);
                kGrad.addColorStop(1, f.secondary);
                ctx.fillStyle = kGrad;

                ctx.beginPath();
                ctx.moveTo(s * 1.05, 0);
                ctx.quadraticCurveTo(s * 0.4, -s * 0.75, -s * 0.35, -s * 0.52);
                ctx.lineTo(-s * 0.25, s * 0.52);
                ctx.quadraticCurveTo(s * 0.4, s * 0.75, s * 1.05, 0);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#fef08a';
                ctx.beginPath();
                ctx.arc(s * 0.25, -s * 0.2, s * 0.14, 0, Math.PI * 2);
                ctx.arc(s * 0.25, s * 0.2, s * 0.14, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#dc2626';
                ctx.beginPath();
                ctx.arc(s * 0.29, -s * 0.2, s * 0.06, 0, Math.PI * 2);
                ctx.arc(s * 0.29, s * 0.2, s * 0.06, 0, Math.PI * 2);
                ctx.fill();

            } else if (f.type === 'boss_megalodon') {
                ctx.fillStyle = isFlashing ? '#fff' : f.secondary;
                ctx.beginPath();
                ctx.moveTo(-s * 0.85, 0);
                ctx.lineTo(-s * 1.55, -s * 0.7 + tailSwing);
                ctx.lineTo(-s * 1.25, tailSwing * 0.3);
                ctx.lineTo(-s * 1.55, s * 0.7 + tailSwing);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = isFlashing ? '#fff' : '#991b1b';
                ctx.beginPath();
                ctx.moveTo(s * 0.1, -s * 0.45);
                ctx.lineTo(-s * 0.35, -s * 1.05);
                ctx.lineTo(-s * 0.55, -s * 0.42);
                ctx.closePath();
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(s * 0.15, s * 0.4);
                ctx.lineTo(-s * 0.25, s * 0.98);
                ctx.lineTo(-s * 0.45, s * 0.38);
                ctx.closePath();
                ctx.fill();

                const mGrad = ctx.createLinearGradient(-s, -s * 0.5, s, s * 0.5);
                mGrad.addColorStop(0, f.secondary);
                mGrad.addColorStop(0.5, isFlashing ? '#ffffff' : f.primary);
                mGrad.addColorStop(1, isFlashing ? '#ffffff' : '#fbbf24');
                ctx.fillStyle = mGrad;

                ctx.beginPath();
                ctx.moveTo(s * 1.2, 0);
                ctx.quadraticCurveTo(s * 0.45, -s * 0.65, -s * 0.95, -s * 0.22);
                ctx.lineTo(-s * 0.95, s * 0.22);
                ctx.quadraticCurveTo(s * 0.45, s * 0.65, s * 1.2, 0);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = '#fef08a';
                ctx.lineWidth = 3;
                for (let g = -1; g <= 1; g++) {
                    ctx.beginPath();
                    ctx.moveTo(g * s * 0.22, -s * 0.38);
                    ctx.lineTo(g * s * 0.22 - 12, s * 0.38);
                    ctx.stroke();
                }

                ctx.fillStyle = '#fef08a';
                ctx.beginPath();
                ctx.arc(s * 0.68, -s * 0.15, s * 0.11, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.arc(s * 0.71, -s * 0.15, s * 0.06, 0, Math.PI * 2);
                ctx.fill();

            } else if (f.type === 'boss_leviathan_turtle') {
                ctx.save();
                ctx.rotate(time * 0.0015);
                ctx.strokeStyle = 'rgba(253, 224, 71, 0.55)';
                ctx.lineWidth = 2.5;
                ctx.setLineDash([10, 8]);
                ctx.beginPath();
                ctx.arc(0, 0, s * 0.98, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();

                const flap = Math.sin(time * 0.009 + f.waveOffset) * 0.28;
                ctx.fillStyle = isFlashing ? '#fff' : f.secondary;
                for (const side of [-1, 1]) {
                    ctx.save();
                    ctx.translate(s * 0.32, side * s * 0.55);
                    ctx.rotate(side * (0.4 + flap));
                    ctx.beginPath();
                    ctx.ellipse(0, side * s * 0.2, s * 0.22, s * 0.38, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                    ctx.save();
                    ctx.translate(-s * 0.45, side * s * 0.45);
                    ctx.rotate(side * (0.7 - flap));
                    ctx.beginPath();
                    ctx.ellipse(0, side * s * 0.15, s * 0.16, s * 0.28, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                ctx.fillStyle = isFlashing ? '#fff' : f.accent;
                ctx.beginPath();
                ctx.ellipse(s * 0.88, 0, s * 0.28, s * 0.2, 0, 0, Math.PI * 2);
                ctx.fill();

                const tGrad = ctx.createRadialGradient(0, 0, s * 0.1, 0, 0, s * 0.8);
                tGrad.addColorStop(0, isFlashing ? '#fff' : '#fef08a');
                tGrad.addColorStop(0.55, isFlashing ? '#fff' : '#f59e0b');
                tGrad.addColorStop(1, '#78350f');
                ctx.fillStyle = tGrad;
                ctx.beginPath();
                ctx.ellipse(0, 0, s * 0.78, s * 0.66, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = 3.5;
                ctx.strokeStyle = '#fef08a';
                ctx.stroke();

                ctx.strokeStyle = '#92400e';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                for (let i = 0; i <= 6; i++) {
                    const a = (i * Math.PI * 2) / 6;
                    const px = Math.cos(a) * s * 0.42;
                    const py = Math.sin(a) * s * 0.36;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.stroke();

            } else if (f.type === 'boss_sea_dragon') {
                for (let seg = 8; seg >= 1; seg--) {
                    const segX = -seg * s * 0.21;
                    const segY = Math.sin(time * 0.011 - seg * 0.55 + f.waveOffset) * (s * 0.22);
                    const segR = s * (0.36 - seg * 0.025);

                    ctx.fillStyle = isFlashing ? '#fff' : '#dc2626';
                    ctx.beginPath();
                    ctx.arc(segX, segY - segR * 0.95, segR * 0.45, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = isFlashing ? '#fff' : (seg % 2 === 0 ? '#facc15' : '#eab308');
                    ctx.beginPath();
                    ctx.arc(segX, segY, segR, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#fef08a';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }

                ctx.fillStyle = isFlashing ? '#fff' : '#ffd700';
                ctx.beginPath();
                ctx.ellipse(s * 0.25, 0, s * 0.48, s * 0.34, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = 2.5;
                ctx.strokeStyle = '#dc2626';
                ctx.stroke();

                ctx.strokeStyle = '#fef08a';
                ctx.lineWidth = 3.5;
                ctx.beginPath();
                ctx.moveTo(0, -s * 0.2);
                ctx.quadraticCurveTo(-s * 0.45, -s * 0.75, -s * 0.8, -s * 0.55);
                ctx.moveTo(s * 0.55, s * 0.1);
                ctx.quadraticCurveTo(s * 0.95, s * 0.55 + tailSwing * 0.4, s * 1.25, s * 0.3);
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(s * 0.42, -s * 0.1, s * 0.11, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#dc2626';
                ctx.beginPath();
                ctx.arc(s * 0.45, -s * 0.1, s * 0.06, 0, Math.PI * 2);
                ctx.fill();

            } else if (f.type === 'manta_gold') {
                const wingFlap = Math.sin(time * 0.011 + f.waveOffset) * (s * 0.22);
                ctx.fillStyle = isFlashing ? '#fff' : f.primary;
                ctx.beginPath();
                ctx.moveTo(s * 0.95, 0);
                ctx.quadraticCurveTo(s * 0.25, -s * 1.05 + wingFlap, -s * 0.4, -s * 0.85 + wingFlap);
                ctx.quadraticCurveTo(-s * 0.7, -s * 0.25, -s * 1.35, tailSwing * 0.4);
                ctx.quadraticCurveTo(-s * 0.7, s * 0.25, -s * 0.4, s * 0.85 - wingFlap);
                ctx.quadraticCurveTo(s * 0.25, s * 1.05 - wingFlap, s * 0.95, 0);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = f.accent;
                ctx.lineWidth = 2;
                ctx.stroke();

            } else if (f.type === 'swordfish') {
                ctx.strokeStyle = isFlashing ? '#fff' : '#67e8f9';
                ctx.lineWidth = 4.5;
                ctx.beginPath();
                ctx.moveTo(s * 0.7, 0);
                ctx.lineTo(s * 1.65, 0);
                ctx.stroke();

                ctx.fillStyle = isFlashing ? '#fff' : f.secondary;
                ctx.beginPath();
                ctx.moveTo(-s * 0.75, 0);
                ctx.lineTo(-s * 1.35, -s * 0.55 + tailSwing);
                ctx.lineTo(-s * 1.15, 0);
                ctx.lineTo(-s * 1.35, s * 0.55 + tailSwing);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = isFlashing ? '#fff' : f.primary;
                ctx.beginPath();
                ctx.ellipse(0, 0, s * 0.92, s * 0.36, 0, 0, Math.PI * 2);
                ctx.fill();

            } else if (f.type === 'hammerhead') {
                ctx.fillStyle = isFlashing ? '#fff' : f.secondary;
                ctx.beginPath();
                ctx.moveTo(-s * 0.8, 0);
                ctx.lineTo(-s * 1.4, -s * 0.58 + tailSwing);
                ctx.lineTo(-s * 1.4, s * 0.58 + tailSwing);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = isFlashing ? '#fff' : f.primary;
                ctx.beginPath();
                ctx.ellipse(0, 0, s * 0.9, s * 0.42, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = isFlashing ? '#fff' : f.accent;
                roundRectPath(ctx, s * 0.62, -s * 0.56, s * 0.26, s * 1.12, 6);
                ctx.fill();

            } else if (f.type === 'jelly_emperor') {
                ctx.strokeStyle = isFlashing ? '#fff' : f.accent;
                ctx.lineWidth = 2.5;
                for (let t = -2; t <= 2; t++) {
                    const ty = t * s * 0.16;
                    const wave = Math.sin(time * 0.01 + t) * (s * 0.18);
                    ctx.beginPath();
                    ctx.moveTo(-s * 0.1, ty);
                    ctx.quadraticCurveTo(-s * 0.65, ty + wave, -s * 1.25, ty - wave);
                    ctx.stroke();
                }

                ctx.fillStyle = isFlashing ? '#fff' : f.primary;
                ctx.beginPath();
                ctx.arc(s * 0.1, 0, s * 0.65, -Math.PI / 2, Math.PI / 2);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#fbcfe8';
                ctx.lineWidth = 2.5;
                ctx.stroke();

            } else if (f.type === 'jade_turtle') {
                const flap = Math.sin(time * 0.012 + f.waveOffset) * (s * 0.2);
                ctx.fillStyle = isFlashing ? '#fff' : f.accent;
                ctx.beginPath();
                ctx.ellipse(s * 0.2, -s * 0.62 + flap, s * 0.16, s * 0.28, 0.3, 0, Math.PI * 2);
                ctx.ellipse(s * 0.2, s * 0.62 - flap, s * 0.16, s * 0.28, -0.3, 0, Math.PI * 2);
                ctx.ellipse(s * 0.78, 0, s * 0.22, s * 0.16, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = isFlashing ? '#fff' : f.primary;
                ctx.beginPath();
                ctx.ellipse(0, 0, s * 0.68, s * 0.56, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = f.accent;
                ctx.lineWidth = 2.5;
                ctx.stroke();

            } else {
                ctx.fillStyle = isFlashing ? '#ffffff' : f.secondary;
                ctx.beginPath();
                ctx.moveTo(-s * 0.75, 0);
                ctx.lineTo(-s * 1.4, -s * 0.55 + tailSwing);
                ctx.lineTo(-s * 1.4, s * 0.55 + tailSwing);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = isFlashing ? '#ffffff' : f.primary;
                ctx.beginPath();
                ctx.ellipse(0, 0, s, s * (f.type === 'puffer' ? 0.78 : 0.6), 0, 0, Math.PI * 2);
                ctx.fill();

                if (f.type === 'clown' && !isFlashing) {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(-s * 0.15, -s * 0.52, s * 0.22, s * 1.04);
                    ctx.fillRect(s * 0.32, -s * 0.42, s * 0.18, s * 0.84);
                }

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(s * 0.52, -s * 0.14, s * 0.15, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                ctx.arc(s * 0.56, -s * 0.14, s * 0.08, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();

            if (f.tier === 'boss') {
                const barW = Math.max(150, f.size * 1.65);
                const barH = 11;
                const bx = f.x - barW / 2;
                const by = f.y - f.size * 0.85 - 24;

                ctx.font = '800 11px Chakra Petch, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillStyle = '#fef08a';
                ctx.fillText(`👑 ${f.name} (${Math.ceil(f.hp)}/${f.maxHp} HP)`, f.x, by - 5);

                ctx.fillStyle = 'rgba(2, 6, 23, 0.88)';
                roundRectPath(ctx, bx - 2, by - 2, barW + 4, barH + 4, 5);
                ctx.fill();
                ctx.strokeStyle = '#facc15';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                const hpRatio = Math.max(0, f.hp / f.maxHp);
                ctx.fillStyle = hpRatio > 0.5 ? '#22c55e' : (hpRatio > 0.25 ? '#f59e0b' : '#ef4444');
                roundRectPath(ctx, bx, by, barW * hpRatio, barH, 4);
                ctx.fill();
            } else if (f.tier === 'large' || f.hp < f.maxHp) {
                const barW = Math.max(48, f.size * 1.05);
                const barH = 6;
                const bx = f.x - barW / 2;
                const by = f.y - f.size * 0.78 - 12;

                ctx.fillStyle = 'rgba(15, 23, 42, 0.82)';
                ctx.fillRect(bx - 1, by - 1, barW + 2, barH + 2);

                const hpRatio = Math.max(0, f.hp / f.maxHp);
                ctx.fillStyle = hpRatio > 0.5 ? '#22c55e' : (hpRatio > 0.25 ? '#f59e0b' : '#ef4444');
                ctx.fillRect(bx, by, barW * hpRatio, barH);
            }
        }

        // ==========================================
        // 11. SINGLE ULTRA-HEAVY BULLETS, NETS & TURRET
        // ==========================================
        function drawBullet(b) {
            for (let i = 0; i < b.trail.length; i++) {
                const pt = b.trail[i];
                const ratio = (i + 1) / b.trail.length;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, b.radius * ratio * (b.level === 5 ? 0.92 : 0.72), 0, Math.PI * 2);
                ctx.fillStyle = b.level === 5 && i % 2 === 0 ? '#ff5722' : b.color;
                ctx.globalAlpha = ratio * (b.level === 5 ? 0.45 : 0.32);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            const angle = Math.atan2(b.vy, b.vx);
            ctx.save();
            ctx.translate(b.x, b.y);
            ctx.rotate(angle);

            if (b.level === 5) {
                b.spin += 0.18;

                ctx.fillStyle = 'rgba(255, 165, 0, 0.24)';
                ctx.beginPath();
                ctx.arc(0, 0, b.radius * 1.9, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#fef08a';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(b.radius * 0.4, 0, b.radius * 1.35, -0.95, 0.95);
                ctx.stroke();

                ctx.save();
                ctx.rotate(b.spin);
                ctx.strokeStyle = '#ff2a85';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.ellipse(0, 0, b.radius * 1.45, b.radius * 0.75, 0.4, 0, Math.PI * 2);
                ctx.stroke();

                ctx.strokeStyle = '#00f2fe';
                ctx.beginPath();
                ctx.ellipse(0, 0, b.radius * 1.45, b.radius * 0.75, -0.4, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();

                ctx.fillStyle = '#f59e0b';
                ctx.beginPath();
                ctx.ellipse(0, 0, b.radius * 1.55, b.radius * 1.05, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = 2.5;
                ctx.strokeStyle = '#fef08a';
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.ellipse(b.radius * 0.22, 0, b.radius * 0.95, b.radius * 0.62, 0, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = b.color;
                ctx.globalAlpha = 0.22;
                ctx.beginPath();
                ctx.arc(0, 0, b.radius * 1.6, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;

                ctx.fillStyle = b.color;
                ctx.beginPath();
                ctx.ellipse(0, 0, b.radius * 1.8, b.radius * 0.95, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.ellipse(b.radius * 0.3, 0, b.radius * 1.0, b.radius * 0.48, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        function drawNet(n) {
            ctx.save();
            ctx.translate(n.x, n.y);
            ctx.rotate(n.rotation);
            ctx.globalAlpha = n.alpha;

            ctx.fillStyle = n.color;
            ctx.globalAlpha = n.alpha * (n.level === 5 ? 0.22 : 0.14);
            ctx.beginPath();
            ctx.arc(0, 0, n.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.globalAlpha = n.alpha;
            ctx.strokeStyle = n.color;

            const sides = n.level === 5 ? 10 : 8;
            for (let ring = 0.35; ring <= 1.0; ring += 0.325) {
                const r = n.radius * ring;
                ctx.beginPath();
                for (let i = 0; i <= sides; i++) {
                    const a = (i * Math.PI * 2) / sides;
                    const px = Math.cos(a) * r;
                    const py = Math.sin(a) * r;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.lineWidth = ring === 1.0 ? (n.level === 5 ? 3.5 : 2.5) : 1.4;
                ctx.stroke();
            }

            for (let i = 0; i < sides; i++) {
                const a = (i * Math.PI * 2) / sides;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(a) * n.radius, Math.sin(a) * n.radius);
                ctx.lineWidth = 1.2;
                ctx.stroke();
            }

            ctx.restore();
        }

        function roundRectPath(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function drawSpinningCoin(x, y, radius, spinPhase) {
            ctx.save();
            ctx.translate(x, y);
            const scaleX = Math.max(0.22, Math.abs(Math.cos(spinPhase)));
            ctx.scale(scaleX, 1);

            ctx.fillStyle = '#facc15';
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.lineWidth = 2;
            ctx.strokeStyle = '#fef9c3';
            ctx.stroke();

            ctx.strokeStyle = '#92400e';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(-radius * 0.32, -radius * 0.32, radius * 0.64, radius * 0.64);
            ctx.restore();
        }

        function drawTurretStepButton(btn, symbol) {
            ctx.save();
            ctx.translate(btn.x, btn.y);

            const r = btn.r;
            ctx.fillStyle = btn.hover ? '#0284c7' : '#1e293b';
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fill();

            ctx.lineWidth = 2.2;
            ctx.strokeStyle = btn.hover ? '#fef08a' : '#eab308';
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = '900 22px Orbitron, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(symbol, 0, 1);
            ctx.restore();
        }

        function drawTurretAndDocks(time, lockedTarget) {
            const spec = TURRET_SPECS[cannon.level];
            cannon.gearAngle += 0.025;

            ctx.save();
            ctx.beginPath();
            ctx.setLineDash([7, 7]);
            ctx.lineDashOffset = -time * 0.05;
            ctx.moveTo(cannon.x + Math.cos(cannon.angle) * 68, cannon.y + Math.sin(cannon.angle) * 68);
            const aimLen = lockedTarget ? Math.hypot(lockedTarget.x - cannon.x, lockedTarget.y - cannon.y) : 310;
            ctx.lineTo(cannon.x + Math.cos(cannon.angle) * aimLen, cannon.y + Math.sin(cannon.angle) * aimLen);
            ctx.strokeStyle = lockedTarget ? '#ef4444' : spec.color;
            ctx.globalAlpha = 0.55;
            ctx.lineWidth = cannon.level === 5 ? 3 : 2.2;
            ctx.stroke();
            ctx.restore();

            if (lockedTarget) {
                ctx.save();
                ctx.translate(lockedTarget.x, lockedTarget.y);
                ctx.rotate(time * 0.004);
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(0, 0, 32, 0, Math.PI * 2);
                ctx.moveTo(-42, 0); ctx.lineTo(-22, 0);
                ctx.moveTo(22, 0); ctx.lineTo(42, 0);
                ctx.moveTo(0, -42); ctx.lineTo(0, -22);
                ctx.moveTo(0, 22); ctx.lineTo(0, 42);
                ctx.stroke();
                ctx.restore();
            }

            ctx.save();
            const dockW = 216;
            const dockH = 58;
            const dockGrad = ctx.createLinearGradient(cannon.x, canvas.height - dockH, cannon.x, canvas.height);
            dockGrad.addColorStop(0, '#1e293b');
            dockGrad.addColorStop(0.5, '#0f172a');
            dockGrad.addColorStop(1, '#020617');

            ctx.fillStyle = dockGrad;
            roundRectPath(ctx, cannon.x - dockW / 2, canvas.height - dockH, dockW, dockH + 10, 22);
            ctx.fill();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = '#eab308';
            ctx.stroke();

            for (const side of [-1, 1]) {
                ctx.save();
                ctx.translate(cannon.x + side * 44, cannon.y + 4);
                ctx.rotate(side * cannon.gearAngle);
                ctx.strokeStyle = 'rgba(250, 204, 21, 0.45)';
                ctx.lineWidth = 3;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.arc(0, 0, 20, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
            ctx.restore();

            ctx.save();
            ctx.translate(cannon.x, cannon.y);
            ctx.rotate(cannon.angle);
            ctx.translate(-cannon.recoil, 0);

            const bLen = spec.barrelLen;
            const bCaliber = spec.caliber;

            if (cannon.muzzleFlash > 0.05) {
                ctx.save();
                ctx.translate(bLen + 6, 0);
                ctx.fillStyle = spec.color;
                ctx.globalAlpha = cannon.muzzleFlash * 0.85;
                const flashR = (cannon.level === 5 ? 34 : 22) * cannon.muzzleFlash;
                ctx.beginPath();
                ctx.arc(0, 0, flashR, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.ellipse(12, 0, flashR, flashR * 0.45, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            if (cannon.level >= 3) {
                ctx.fillStyle = cannon.level === 5 ? '#991b1b' : spec.secondary;
                ctx.strokeStyle = '#facc15';
                ctx.lineWidth = 1.5;
                for (const side of [-1, 1]) {
                    ctx.beginPath();
                    ctx.moveTo(12, side * (bCaliber * 0.45));
                    ctx.lineTo(28, side * (bCaliber * 0.92));
                    ctx.lineTo(bLen - 10, side * (bCaliber * 0.62));
                    ctx.lineTo(bLen - 6, side * (bCaliber * 0.45));
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                }
            }

            ctx.fillStyle = cannon.level === 5 ? '#78350f' : '#334155';
            roundRectPath(ctx, 10, -bCaliber / 2, bLen, bCaliber, 6);
            ctx.fill();
            ctx.lineWidth = 2.2;
            ctx.strokeStyle = spec.color;
            ctx.stroke();

            ctx.fillStyle = spec.color;
            roundRectPath(ctx, 18, -bCaliber * 0.24, bLen - 12, bCaliber * 0.48, 3);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(22, -2, bLen - 18, 4);

            ctx.fillStyle = cannon.level === 5 ? '#ffd700' : '#475569';
            roundRectPath(ctx, bLen - 2, -bCaliber * 0.64, 10, bCaliber * 1.28, 3);
            ctx.fill();
            ctx.strokeStyle = '#fef08a';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            const shroudGrad = ctx.createLinearGradient(0, -24, 0, 24);
            shroudGrad.addColorStop(0, '#b45309');
            shroudGrad.addColorStop(0.5, '#fde047');
            shroudGrad.addColorStop(1, '#78350f');
            ctx.fillStyle = shroudGrad;
            roundRectPath(ctx, 12, -bCaliber * 0.65, 24, bCaliber * 1.3, 6);
            ctx.fill();
            ctx.restore();

            ctx.save();
            ctx.translate(cannon.x, cannon.y);

            const domeGrad = ctx.createRadialGradient(-8, -8, 4, 0, 0, 40);
            domeGrad.addColorStop(0, '#475569');
            domeGrad.addColorStop(0.65, '#1e293b');
            domeGrad.addColorStop(1, '#0f172a');
            ctx.fillStyle = domeGrad;
            ctx.beginPath();
            ctx.arc(0, 0, 39, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 3.5;
            ctx.strokeStyle = '#facc15';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, 0, 26, 0, Math.PI * 2);
            ctx.fillStyle = '#091326';
            ctx.fill();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = spec.color;
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = '900 14px Orbitron, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(`-${spec.cost} XU`, 0, -3);

            ctx.fillStyle = spec.color;
            ctx.font = '700 10px Chakra Petch, sans-serif';
            ctx.fillText(`PHÁO CẤP ${cannon.level}`, 0, 11);
            ctx.restore();

            drawTurretStepButton(cannon.minusBtn, '−');
            drawTurretStepButton(cannon.plusBtn, '+');

            drawAdjacentCoinBox(time);
            drawRightTacticalDock();
        }

        function drawAdjacentCoinBox(time) {
            const box = cannon.coinBox;
            ctx.save();

            const centerX = box.x + box.w / 2;
            const centerY = box.y + box.h / 2;
            const scale = 1 + coinBoxPulse * 0.08;
            ctx.translate(centerX, centerY);
            ctx.scale(scale, scale);
            ctx.translate(-centerX, -centerY);

            ctx.fillStyle = '#0f172a';
            roundRectPath(ctx, box.x, box.y, box.w, box.h, 14);
            ctx.fill();

            ctx.lineWidth = 2.5;
            ctx.strokeStyle = score < 30 ? '#f43f5e' : '#facc15';
            ctx.stroke();

            ctx.fillStyle = '#030712';
            roundRectPath(ctx, box.x + 6, box.y + 6, box.w - 12, box.h - 12, 10);
            ctx.fill();

            drawSpinningCoin(box.coinTargetX, box.coinTargetY, 16, time * 0.005);

            ctx.fillStyle = '#34d399';
            ctx.font = '700 9.5px Chakra Petch, sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText('VÍ XU ĐỒNG BỘ SẢNH', box.x + 52, box.y + 10);

            ctx.fillStyle = score < 30 ? '#fb7185' : '#ffd700';
            ctx.font = '900 22px Orbitron, monospace';
            ctx.textBaseline = 'bottom';
            ctx.fillText(score.toLocaleString('vi-VN'), box.x + 52, box.y + box.h - 9);
            ctx.restore();

            const rb = cannon.rechargeBtn;
            ctx.save();
            ctx.fillStyle = (score < 100 || rb.hover) ? '#059669' : '#0f172a';
            roundRectPath(ctx, rb.x, rb.y, rb.w, rb.h, 8);
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = score < 100 ? '#6ee7b7' : '#38bdf8';
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = '700 11px Chakra Petch, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🎁 +NẠP 1.000 XU MIỄN PHÍ', rb.x + rb.w / 2, rb.y + rb.h / 2 + 1);
            ctx.restore();
        }

        function drawRightTacticalDock() {
            const ab = cannon.autoBtn;
            ctx.save();
            ctx.fillStyle = autoFire ? '#059669' : (ab.hover ? '#1e293b' : '#0f172a');
            roundRectPath(ctx, ab.x, ab.y, ab.w, ab.h, 8);
            ctx.fill();
            ctx.lineWidth = 1.8;
            ctx.strokeStyle = autoFire ? '#34d399' : '#38bdf8';
            ctx.stroke();
            ctx.fillStyle = '#ffffff';
            ctx.font = '700 11px Chakra Petch, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(autoFire ? '⚡ TỰ BẮN: BẬT' : '⚡ TỰ BẮN: TẮT', ab.x + ab.w / 2, ab.y + ab.h / 2 + 1);
            ctx.restore();

            const lb = cannon.lockBtn;
            ctx.save();
            ctx.fillStyle = lockBoss ? '#be123c' : (lb.hover ? '#1e293b' : '#0f172a');
            roundRectPath(ctx, lb.x, lb.y, lb.w, lb.h, 8);
            ctx.fill();
            ctx.lineWidth = 1.8;
            ctx.strokeStyle = lockBoss ? '#fda4af' : '#f59e0b';
            ctx.stroke();
            ctx.fillStyle = '#ffffff';
            ctx.font = '700 11px Chakra Petch, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(lockBoss ? '🎯 KHÓA BOSS: BẬT' : '🎯 KHÓA BOSS', lb.x + lb.w / 2, lb.y + lb.h / 2 + 1);
            ctx.restore();

            const sb = cannon.summonBtn;
            ctx.save();
            ctx.fillStyle = sb.hover ? '#f43f5e' : '#e11d48';
            roundRectPath(ctx, sb.x, sb.y, sb.w, sb.h, 8);
            ctx.fill();
            ctx.lineWidth = 1.8;
            ctx.strokeStyle = '#fef08a';
            ctx.stroke();
            ctx.fillStyle = '#ffffff';
            ctx.font = '800 11px Chakra Petch, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🐉 TRIỆU HỒI BOSS NGAY', sb.x + sb.w / 2, sb.y + sb.h / 2 + 1);
            ctx.restore();
        }

        // ==========================================
        // 12. MAIN 60-FPS GAME LOOP
        // ==========================================
        function gameLoop(time) {
            frameCount++;
            if (time - lastFpsUpdate >= 500) {
                const currentFps = Math.min(60, Math.round((frameCount * 1000) / (time - lastFpsUpdate)));
                fpsCounterEl.textContent = currentFps;
                frameCount = 0;
                lastFpsUpdate = time;
            }

            ctx.save();
            if (screenShake > 0.5) {
                const dx = (Math.random() - 0.5) * screenShake;
                const dy = (Math.random() - 0.5) * screenShake;
                ctx.translate(dx, dy);
                screenShake *= 0.86;
            } else {
                screenShake = 0;
            }

            drawOceanBackground(time);

            const lockedTarget = lockBoss ? getLockedTarget() : null;
            if (lockedTarget) {
                cannon.angle = clampTurretAngle(Math.atan2(lockedTarget.y - cannon.y, lockedTarget.x - cannon.x));
            }

            if (isMouseDown || autoFire || (lockBoss && lockedTarget)) {
                tryShoot(time);
            }

            cannon.recoil *= 0.82;
            cannon.muzzleFlash *= 0.78;
            coinBoxPulse *= 0.85;

            for (let i = fishes.length - 1; i >= 0; i--) {
                const f = fishes[i];
                f.x += f.speed * f.dir;
                f.y = f.baseY + Math.sin(time * f.waveFreq + f.waveOffset) * f.waveAmp;
                if (f.hitFlash > 0) f.hitFlash--;

                drawCreature(f, time);

                const offMargin = f.size * 2.6;
                if (f.tier === 'boss') {
                    if (f.dir === 1 && f.x > canvas.width + offMargin * 0.6) {
                        f.dir = -1;
                    } else if (f.dir === -1 && f.x < -offMargin * 0.6) {
                        f.dir = 1;
                    }
                } else {
                    if ((f.dir === 1 && f.x > canvas.width + offMargin) || (f.dir === -1 && f.x < -offMargin)) {
                        fishes.splice(i, 1);
                    }
                }
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];

                b.trail.push({ x: b.x, y: b.y });
                if (b.trail.length > (b.level === 5 ? 8 : 5)) b.trail.shift();

                b.x += b.vx;
                b.y += b.vy;

                let bounced = false;
                if (b.x <= b.radius) {
                    b.x = b.radius;
                    b.vx = Math.abs(b.vx);
                    bounced = true;
                } else if (b.x >= canvas.width - b.radius) {
                    b.x = canvas.width - b.radius;
                    b.vx = -Math.abs(b.vx);
                    bounced = true;
                }

                if (b.y <= b.radius) {
                    b.y = b.radius;
                    b.vy = Math.abs(b.vy);
                    bounced = true;
                } else if (b.y >= canvas.height - b.radius) {
                    b.y = canvas.height - b.radius;
                    b.vy = -Math.abs(b.vy);
                    bounced = true;
                }

                if (bounced) {
                    b.bounces++;
                    sound.playBounce();

                    for (let s = 0; s < 3; s++) {
                        const ang = Math.random() * Math.PI * 2;
                        const spd = 1.5 + Math.random() * 3.5;
                        addParticle(b.x, b.y, Math.cos(ang) * spd, Math.sin(ang) * spd, 2.2, b.color, 0.09);
                    }

                    if (b.bounces > b.maxBounces) {
                        bullets.splice(i, 1);
                        continue;
                    }
                }

                drawBullet(b);

                let hitFish = false;
                for (let j = fishes.length - 1; j >= 0; j--) {
                    const f = fishes[j];
                    const hitDist = Math.hypot(b.x - f.x, b.y - f.y);
                    if (hitDist < f.size * 0.88 + b.radius) {
                        hitFish = true;
                        sound.playNetHit(b.level);

                        nets.push({
                            x: b.x,
                            y: b.y,
                            radius: 16,
                            maxRadius: b.netRadius,
                            color: b.color,
                            level: b.level,
                            alpha: 1,
                            rotation: Math.random() * Math.PI
                        });

                        if (b.level === 5) {
                            screenShake = Math.max(screenShake, 7);
                            shockwaves.push({
                                x: b.x,
                                y: b.y,
                                radius: 18,
                                maxRadius: b.netRadius * 1.25,
                                color: '#fef08a',
                                alpha: 0.9,
                                lineWidth: 5
                            });
                        }

                        for (let k = fishes.length - 1; k >= 0; k--) {
                            const target = fishes[k];
                            if (Math.hypot(b.x - target.x, b.y - target.y) <= b.netRadius + target.size * 0.55) {
                                target.hp -= b.power;
                                target.hitFlash = 5;

                                if (target.tier === 'boss' && Math.random() < 0.45) {
                                    addFloatingText(
                                        target.x + (Math.random() - 0.5) * target.size * 0.8,
                                        target.y - target.size * 0.4,
                                        `-${Math.round(b.power)}`,
                                        b.level === 5 ? '#fde047' : '#fb7185',
                                        b.level === 5 ? 0.95 : 0.75
                                    );
                                }

                                if (target.hp <= 0) {
                                    onFishDefeated(target);
                                    fishes.splice(k, 1);
                                }
                            }
                        }
                        break;
                    }
                }

                if (hitFish) {
                    bullets.splice(i, 1);
                }
            }

            for (let i = nets.length - 1; i >= 0; i--) {
                const n = nets[i];
                n.radius += (n.maxRadius - n.radius) * 0.24;
                n.alpha -= 0.042;
                n.rotation += 0.018;
                drawNet(n);
                if (n.alpha <= 0) nets.splice(i, 1);
            }

            for (let i = shockwaves.length - 1; i >= 0; i--) {
                const sw = shockwaves[i];
                sw.radius += (sw.maxRadius - sw.radius) * 0.18;
                sw.alpha -= 0.045;
                if (sw.alpha <= 0) {
                    shockwaves.splice(i, 1);
                    continue;
                }
                ctx.save();
                ctx.globalAlpha = sw.alpha;
                ctx.strokeStyle = sw.color;
                ctx.lineWidth = sw.lineWidth;
                ctx.beginPath();
                ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }

            if (particles.length > 0) {
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.alpha -= p.decay;

                    if (p.alpha <= 0) {
                        particles.splice(i, 1);
                        continue;
                    }

                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            drawTurretAndDocks(time, lockedTarget);

            for (let i = flyingCoins.length - 1; i >= 0; i--) {
                const fc = flyingCoins[i];
                if (fc.delay > 0) {
                    fc.delay--;
                    continue;
                }

                fc.t += fc.speed;
                const t = Math.min(1, fc.t);
                const invT = 1 - t;

                fc.x = invT * invT * fc.startX + 2 * invT * t * fc.cpX + t * t * cannon.coinBox.coinTargetX;
                fc.y = invT * invT * fc.startY + 2 * invT * t * fc.cpY + t * t * cannon.coinBox.coinTargetY;

                drawSpinningCoin(fc.x, fc.y, 11, time * 0.018 + fc.spinPhase);

                if (fc.t >= 1) {
                    pendingScore = Math.max(0, pendingScore - fc.value);
                    saveWalletToStorage(score + fc.value, true);
                    coinBoxPulse = 1.0;
                    sound.playCoinCollect();

                    for (let s = 0; s < 2; s++) {
                        const ang = Math.random() * Math.PI * 2;
                        addParticle(
                            cannon.coinBox.coinTargetX,
                            cannon.coinBox.coinTargetY,
                            Math.cos(ang) * 2.5,
                            Math.sin(ang) * 2.5,
                            2,
                            '#fef08a',
                            0.1
                        );
                    }
                    flyingCoins.splice(i, 1);
                }
            }

            for (let i = jackpotBadges.length - 1; i >= 0; i--) {
                const jb = jackpotBadges[i];
                jb.life--;
                jb.scale = Math.min(1.0, jb.scale + 0.08);
                jb.rotation += 0.025;

                ctx.save();
                ctx.translate(jb.x, jb.y);
                ctx.scale(jb.scale, jb.scale);
                ctx.globalAlpha = Math.min(1, jb.life / 25);

                ctx.save();
                ctx.rotate(jb.rotation);
                for (let r = 0; r < 12; r++) {
                    ctx.rotate((Math.PI * 2) / 12);
                    ctx.fillStyle = r % 2 === 0 ? 'rgba(250, 204, 21, 0.45)' : 'rgba(244, 63, 94, 0.35)';
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(-14, -85);
                    ctx.lineTo(14, -85);
                    ctx.closePath();
                    ctx.fill();
                }
                ctx.restore();

                ctx.fillStyle = '#78350f';
                ctx.beginPath();
                ctx.arc(0, 0, 58, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#fef08a';
                ctx.stroke();

                ctx.fillStyle = '#fef08a';
                ctx.font = '800 12px Chakra Petch, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('🎉 NỔ HŨ ĐẠI BOSS 🎉', 0, -20);

                ctx.fillStyle = '#ffffff';
                ctx.font = '700 11px Chakra Petch, sans-serif';
                ctx.fillText(jb.bossName, 0, -4);

                ctx.fillStyle = '#ffd700';
                ctx.font = '900 22px Orbitron, sans-serif';
                ctx.fillText(`+${jb.reward.toLocaleString('vi-VN')} XU`, 0, 22);
                ctx.restore();

                if (jb.life <= 0) jackpotBadges.splice(i, 1);
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.y -= 1.3;
                ft.alpha -= 0.024;

                if (ft.alpha <= 0) {
                    floatingTexts.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = ft.alpha;
                ctx.font = `900 ${Math.round(19 * ft.scale)}px Orbitron, sans-serif`;
                ctx.textAlign = 'center';
                ctx.strokeStyle = '#020617';
                ctx.lineWidth = 3.5;
                ctx.strokeText(ft.text, ft.x, ft.y);
                ctx.fillStyle = ft.color;
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            }

            if (bossWarningBanner.alpha > 0.01) {
                bossWarningBanner.alpha -= 0.008;
                ctx.save();
                ctx.globalAlpha = Math.min(1, bossWarningBanner.alpha * 1.4);
                const bw = Math.min(560, canvas.width - 30);
                const bx = (canvas.width - bw) / 2;
                const by = 58;

                ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
                roundRectPath(ctx, bx, by, bw, 50, 12);
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = bossWarningBanner.color;
                ctx.stroke();

                ctx.fillStyle = '#fef08a';
                ctx.font = '800 14px Chakra Petch, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(bossWarningBanner.text, canvas.width / 2, by + 20);

                ctx.fillStyle = '#38bdf8';
                ctx.font = '700 11px Chakra Petch, sans-serif';
                ctx.fillText(bossWarningBanner.subtext, canvas.width / 2, by + 38);
                ctx.restore();
            }

            ctx.restore();
            requestAnimationFrame(gameLoop);
        }

        window.onload = function () {
            score = loadWalletFromStorage();
            updateLayout();
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
