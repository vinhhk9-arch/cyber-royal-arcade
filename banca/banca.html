         * - Real-time Shared Wallet Synchronization ('ARCADE_WALLET_COINS') with sanhcho.html & doden.html
         * - Auto-flushes mid-air flying coins into wallet before page navigation so zero coins are lost
         * - 100% ShadowBlur-free rendering pipeline + Offscreen Background Caching for locked 60 FPS
         * - Level 5 Cannon fires 1 colossal Dragon-Core Plasma Singularity projectile
         */

        // ==========================================
        // 0. SHARED WALLET SYNCHRONIZATION ENGINE
        // ==========================================
        const WALLET_KEY = 'ARCADE_WALLET_COINS';
        const DEFAULT_WALLET_COINS = 2500;
        const walletChannel = ('BroadcastChannel' in window) ? new BroadcastChannel('ARCADE_WALLET_SYNC') : null;

        let score = DEFAULT_WALLET_COINS;
        let pendingScore = 0; // Coins currently flying to tray

        function loadWalletFromStorage() {
            try {
                const raw = localStorage.getItem(WALLET_KEY);
                if (raw === null || isNaN(parseInt(raw, 10))) {
                    localStorage.setItem(WALLET_KEY, String(DEFAULT_WALLET_COINS));
                    return DEFAULT_WALLET_COINS;
                }
                return Math.max(0, parseInt(raw, 10));
            } catch (e) {
                return DEFAULT_WALLET_COINS;
            }
        }

        function saveWalletToStorage(newScore, broadcast = true) {
            score = Math.max(0, Math.round(newScore));
            try {
                localStorage.setItem(WALLET_KEY, String(score));
                if (broadcast && walletChannel) {
                    walletChannel.postMessage({ type: 'WALLET_UPDATE', coins: score, source: 'banca' });
                }
            } catch (e) {}
        }

        // Flush any coins still flying in the air into the wallet before leaving the page
        function flushPendingCoinsToWallet() {
            if (pendingScore > 0) {
                score += pendingScore;
                pendingScore = 0;
                flyingCoins.length = 0;
            }
            saveWalletToStorage(score, true);
        }

        function navigateWithWalletSync(targetFile) {
            flushPendingCoinsToWallet();
            window.location.href = targetFile;
        }

        // Initialize score from shared wallet
        score = loadWalletFromStorage();

        // Listen for wallet changes from sanhcho.html or doden.html in other tabs
        window.addEventListener('storage', (e) => {
            if (e.key === WALLET_KEY && e.newValue !== null) {
                const incoming = parseInt(e.newValue, 10);
                if (!isNaN(incoming)) {
                    score = Math.max(0, incoming);
                    coinBoxPulse = 1.0;
                }
            }
        });

        if (walletChannel) {
            walletChannel.onmessage = (event) => {
                if (event.data && event.data.type === 'WALLET_UPDATE' && typeof event.data.coins === 'number') {
                    score = Math.max(0, Math.round(event.data.coins));
                    coinBoxPulse = 1.0;
                }
            };
        }

        window.addEventListener('pageshow', () => {
            score = loadWalletFromStorage();
        });

        window.addEventListener('beforeunload', () => {
            flushPendingCoinsToWallet();
        });

        // Navigation buttons
        document.getElementById('backLobbyBtn').addEventListener('click', () => {

        // ==========================================
        // 1. WEB AUDIO SYNTHESIZER
        // ==========================================
        class SoundManager {
            constructor() {
                this.enabled = true;
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playShoot(level) {
                if (!this.enabled || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    if (level === 5) {
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(240, now);
                        osc.frequency.exponentialRampToValueAtTime(38, now + 0.24);
                        gain.gain.setValueAtTime(0.18, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.24);
                    } else {
                        const types = ['triangle', 'square', 'sawtooth', 'sawtooth'];
                        osc.type = types[(level - 1) % types.length];
                        const baseFreq = 540 - level * 65;
                        osc.frequency.setValueAtTime(baseFreq, now);
                        osc.frequency.exponentialRampToValueAtTime(65, now + 0.14);
                        gain.gain.setValueAtTime(0.09 + level * 0.015, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.14);
                    }
                } catch (e) {}
            }

            playBounce() {
                if (!this.enabled || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(820, now);
                    osc.frequency.exponentialRampToValueAtTime(1350, now + 0.04);

                    gain.gain.setValueAtTime(0.035, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.04);
                } catch (e) {}
            }

            playNetHit(level) {
                if (!this.enabled || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = level === 5 ? 'sawtooth' : 'triangle';
                    const startF = level === 5 ? 150 : 220;
                    const dur = level === 5 ? 0.18 : 0.1;
                    osc.frequency.setValueAtTime(startF, now);
                    osc.frequency.exponentialRampToValueAtTime(35, now + dur);

                    gain.gain.setValueAtTime(level === 5 ? 0.13 : 0.065, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + dur);
                } catch (e) {}
            }

            playCoinCollect() {
                if (!this.enabled || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1046.5, now);
                    osc.frequency.setValueAtTime(1318.5, now + 0.045);

                    gain.gain.setValueAtTime(0.07, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } catch (e) {}
            }

            playSwitchLevel() {
                if (!this.enabled || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(740, now + 0.08);

                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } catch (e) {}
            }

            playBossSpawn() {
                if (!this.enabled || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(130, now);
                    osc.frequency.linearRampToValueAtTime(65, now + 0.6);

                    gain.gain.setValueAtTime(0.13, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.65);
                } catch (e) {}
            }

            playBossJackpot() {
                if (!this.enabled || !this.ctx) return;
                try {
                    const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98];
                    notes.forEach((freq, idx) => {
                        const now = this.ctx.currentTime + idx * 0.07;
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now);
                        gain.gain.setValueAtTime(0.13, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.32);
                    });
                } catch (e) {}
            }

            playLevelUp() {
                if (!this.enabled || !this.ctx) return;
                try {
                    const notes = [440, 554.37, 659.25, 880, 1108.73, 1318.5];
                    notes.forEach((freq, idx) => {
                        const now = this.ctx.currentTime + idx * 0.065;
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now);
                        gain.gain.setValueAtTime(0.15, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.38);
                    });
                } catch (e) {}
            }
        }
