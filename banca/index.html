
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Royal Arcade</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #101326, #25204a, #111827);
    }

    .container {
      text-align: center;
      padding: 30px;
    }

    h1 {
      font-size: clamp(30px, 7vw, 48px);
      margin-bottom: 12px;
    }

    p {
      color: #c7c9dc;
      margin-bottom: 30px;
    }

    .play-button {
      display: inline-block;
      padding: 15px 38px;
      border-radius: 12px;
      background: #f5c542;
      color: #171717;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
      transition: 0.2s;
    }

    .play-button:hover {
      background: #ffe082;
      transform: translateY(-3px);
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>👑 Cyber Royal Arcade</h1>
    <p>Sẵn sàng bước vào thế giới trò chơi?</p>

    <a class="play-button" href="sanhcho.html">
      Vào chơi
    </a>
  </main>
</body>
</html>
