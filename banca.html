<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Bắn Cá Siêu Thị 2D - Đấu Trường Đại Boss</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Chakra+Petch:wght@500;600;700&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #020b18;
            font-family: 'Chakra Petch', sans-serif;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overscroll-behavior: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        .led-font {
            font-family: 'Orbitron', monospace;
        }

        /* Khi bật chế độ phóng to trên điện thoại, thu gọn thanh HUD phía trên để mở rộng tầm nhìn */
        body.is-fullscreen-active #topHudBar {
            padding-top: 2px;
            transform: scale(0.94);
            transform-origin: top center;
        }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden">

    <!-- Thanh điều hướng, Cấp độ Đại dương, Phóng to/Thu nhỏ & FPS -->
    <div id="topHudBar" class="absolute top-1.5 left-2 right-2 md:top-2 md:left-3 md:right-3 flex flex-wrap justify-between items-center gap-1.5 md:gap-2 pointer-events-none z-10 transition-transform duration-200">
        
        <!-- Trái: Điều hướng Sảnh Chờ / Đỏ Đen -->
        <div class="flex items-center gap-1.5 md:gap-2 pointer-events-auto">
            <button id="backLobbyBtn" class="bg-slate-900/90 hover:bg-slate-800 border border-cyan-400/60 text-cyan-300 text-[11px] md:text-sm font-extrabold px-2.5 py-1 md:px-3 md:py-1.5 rounded-xl shadow-lg transition active:scale-95 flex items-center gap-1">
                🏠 <span class="hidden sm:inline">SẢNH CHỜ</span><span class="sm:hidden">SẢNH</span>
            </button>
            <button id="goDoDenBtn" class="bg-gradient-to-r from-rose-700 to-slate-900 hover:from-rose-600 hover:to-slate-800 border border-rose-400/60 text-amber-200 text-[11px] md:text-sm font-extrabold px-2.5 py-1 md:px-3 md:py-1.5 rounded-xl shadow-lg transition active:scale-95 flex items-center gap-1">
                🎲 <span class="hidden sm:inline">ĐỎ ĐEN</span>
            </button>
            <div class="hidden xl:flex bg-slate-950/90 border border-amber-400/40 px-3 py-1.5 rounded-xl items-center gap-2 shadow-xl pointer-events-none">
                <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                <span class="text-xs text-cyan-100 font-bold tracking-wide">
                    Kỹ năng: <span class="text-sky-300 font-extrabold">[Q] Đóng Băng</span> • <span class="text-pink-400 font-extrabold">[W] Ngắm Laze</span> • <span class="text-yellow-300 font-extrabold">[E] Đạn Điện Ghim Tâm 20s</span>
                </span>
            </div>
        </div>

        <!-- Giữa: Thanh Cấp Độ & EXP Đại Dương (Tự thu gọn trên điện thoại) -->
        <div class="bg-slate-950/90 border border-cyan-400/50 px-2.5 py-1 md:px-3.5 md:py-1.5 rounded-xl flex items-center gap-2 md:gap-3 shadow-xl min-w-[175px] sm:min-w-[260px] md:min-w-[350px] order-3 sm:order-2 w-full sm:w-auto justify-between">
            <div class="flex items-center gap-1.5 flex-1">
                <span class="bg-gradient-to-br from-amber-400 to-orange-600 text-slate-950 font-black text-[10px] md:text-xs px-1.5 py-0.5 rounded-md led-font whitespace-nowrap" id="stageLevelBadge">CẤP 1</span>
                <div class="flex flex-col flex-1">
                    <div class="flex items-center justify-between gap-1">
                        <span id="stageNameText" class="text-[10px] md:text-xs font-extrabold text-amber-300 tracking-wide truncate">VỊNH SAN HÔ</span>
                        <span id="stageBonusText" class="text-[9px] md:text-[11px] font-bold text-emerald-400 whitespace-nowrap">+0% XU</span>
                    </div>
                    <div class="w-full sm:w-32 md:w-44 h-1.5 md:h-2 bg-slate-800 rounded-full overflow-hidden border border-slate-700 mt-0.5">
                        <div id="expBarFill" class="h-full bg-gradient-to-r from-cyan-400 via-amber-300 to-rose-500 transition-all duration-150" style="width: 0%"></div>
                    </div>
                </div>
            </div>
            <span id="expText" class="text-[10px] md:text-[11px] text-cyan-200 font-bold led-font ml-1 whitespace-nowrap">0/450 EXP</span>
        </div>

        <!-- Phải: Nút Phóng To / Thu Nhỏ (Toàn màn hình), Triệu hồi Boss & Âm thanh -->
        <div class="flex items-center gap-1.5 md:gap-2 pointer-events-auto order-2 sm:order-3 ml-auto sm:ml-0">
            <div class="hidden sm:block bg-slate-950/90 border border-emerald-500/40 px-2 py-1 md:px-2.5 md:py-1.5 rounded-xl text-[11px] md:text-xs font-extrabold text-emerald-400 led-font shadow-lg">
                <span id="fpsCounter">60</span> FPS
            </div>
            <button id="spawnBossTopBtn" class="bg-gradient-to-r from-rose-600 to-amber-600 hover:from-rose-500 hover:to-amber-500 border border-amber-300 text-white text-[11px] md:text-sm font-extrabold px-2.5 py-1 md:px-3 md:py-1.5 rounded-xl shadow-lg transition active:scale-95">
                🐉 <span class="hidden md:inline">TRIỆU HỒI </span>BOSS
            </button>
            <button id="soundBtn" class="bg-slate-900/90 hover:bg-slate-800 border border-amber-400/50 text-amber-300 text-[11px] md:text-sm font-bold px-2.5 py-1 md:px-3 md:py-1.5 rounded-xl shadow-lg transition active:scale-95">
                🔊 <span class="hidden lg:inline">ÂM THANH: </span><span id="soundText">BẬT</span>
            </button>
            <!-- Nút Phóng To & Thu Nhỏ (Toàn màn hình) -->
            <button id="fullscreenBtn" class="bg-gradient-to-r from-cyan-600 to-blue-700 hover:from-cyan-500 hover:to-blue-600 border border-cyan-300 text-white text-[11px] md:text-sm font-extrabold px-2.5 py-1 md:px-3 md:py-1.5 rounded-xl shadow-lg transition active:scale-95 flex items-center gap-1">
                <span id="fullscreenIcon">⛶</span>
                <span id="fullscreenText">PHÓNG TO</span>
            </button>
        </div>
    </div>

    <!-- Màn hình Canvas chính -->
    <canvas id="gameCanvas"></canvas>

    <!-- Nhúng 2 Module: 1. Nhân vật Cá & Boss (fishes.js) | 2. Bộ máy Game & Vũ khí (game.js) -->
    <script src="fishes.js"></script>
    <script src="game.js"></script>

    <!-- Script điều khiển Phóng To / Thu Nhỏ (Toàn màn hình) cho Điện thoại & PC -->
    <script>
        (function () {
            const fsBtn = document.getElementById('fullscreenBtn');
            const fsIcon = document.getElementById('fullscreenIcon');
            const fsText = document.getElementById('fullscreenText');
            let pseudoFullscreen = false;

            function isNativeFullscreen() {
                return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
            }

            function updateFullscreenUI() {
                const active = isNativeFullscreen() || pseudoFullscreen;
                document.body.classList.toggle('is-fullscreen-active', active);
                if (active) {
                    fsIcon.textContent = '🗗';
                    fsText.textContent = 'THU NHỎ';
                    fsBtn.className = 'bg-gradient-to-r from-amber-500 to-rose-600 border border-yellow-200 text-white text-[11px] md:text-sm font-extrabold px-2.5 py-1 md:px-3 md:py-1.5 rounded-xl shadow-lg transition active:scale-95 flex items-center gap-1';
                } else {
                    fsIcon.textContent = '⛶';
                    fsText.textContent = 'PHÓNG TO';
                    fsBtn.className = 'bg-gradient-to-r from-cyan-600 to-blue-700 hover:from-cyan-500 hover:to-blue-600 border border-cyan-300 text-white text-[11px] md:text-sm font-extrabold px-2.5 py-1 md:px-3 md:py-1.5 rounded-xl shadow-lg transition active:scale-95 flex items-center gap-1';
                }
                if (typeof updateLayout === 'function') {
                    setTimeout(updateLayout, 80);
                }
            }

            async function toggleFullscreen() {
                const docEl = document.documentElement;
                try {
                    if (!isNativeFullscreen() && !pseudoFullscreen) {
                        if (docEl.requestFullscreen) {
                            await docEl.requestFullscreen();
                        } else if (docEl.webkitRequestFullscreen) {
                            await docEl.webkitRequestFullscreen();
                        } else {
                            // Dự phòng cho iOS Safari không hỗ trợ Fullscreen API trên thẻ div/body
                            pseudoFullscreen = true;
                            window.scrollTo(0, 1);
                        }
                    } else {
                        if (isNativeFullscreen()) {
                            if (document.exitFullscreen) {
                                await document.exitFullscreen();
                            } else if (document.webkitExitFullscreen) {
                                await document.webkitExitFullscreen();
                            }
                        }
                        pseudoFullscreen = false;
                    }
                } catch (err) {
                    pseudoFullscreen = !pseudoFullscreen;
                }
                updateFullscreenUI();
            }

            fsBtn.addEventListener('click', toggleFullscreen);
            document.addEventListener('fullscreenchange', updateFullscreenUI);
            document.addEventListener('webkitfullscreenchange', updateFullscreenUI);
        })();
    </script>
</body>
</html>
